<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>⚡ FIGHT! Stone | Paper | Scissors ⚡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0f1e 0%, #0f172a 50%, #1e1b4b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            padding: 20px;
        }

        .game-container {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 60px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 700px;
        }

        .arena {
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 40px;
            padding: 25px;
            position: relative;
        }

        /* VS Section */
        .vs-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .fighter {
            flex: 1;
            text-align: center;
            background: rgba(0,0,0,0.5);
            border-radius: 30px;
            padding: 20px;
            transition: all 0.1s ease;
        }

        /* Shake Animation */
        .fighter.shake {
            animation: shake 0.3s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-10px, 5px) rotate(-3deg); }
            50% { transform: translate(10px, -5px) rotate(3deg); }
            75% { transform: translate(-5px, 2px) rotate(-1deg); }
            100% { transform: translate(0, 0) rotate(0); }
        }

        .hand-icon {
            font-size: 80px;
            display: inline-block;
            transition: transform 0.2s ease;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
        }

        .fighter-name {
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
            background: linear-gradient(135deg, #ffd89b, #c7e9fb);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .vs {
            font-size: 45px;
            font-weight: 900;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(245,87,108,0.3);
        }

        /* Damage Number Animation */
        .damage-number {
            position: absolute;
            font-size: 40px;
            font-weight: 900;
            pointer-events: none;
            z-index: 100;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-80px) scale(1.5);
            }
        }

        /* Result Display */
        .result-area {
            background: rgba(0,0,0,0.6);
            border-radius: 50px;
            padding: 15px;
            margin: 20px 0;
            text-align: center;
        }

        .result-text {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .result-text.win { color: #4ade80; text-shadow: 0 0 10px #4ade80; }
        .result-text.lose { color: #f87171; text-shadow: 0 0 10px #f87171; }
        .result-text.tie { color: #fbbf24; text-shadow: 0 0 10px #fbbf24; }

        /* Choice Buttons */
        .choices-area {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .choice-btn {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50px;
            padding: 15px 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            min-width: 120px;
        }

        .choice-btn:hover {
            transform: translateY(-5px);
            border-color: #f5576c;
            box-shadow: 0 10px 25px -5px rgba(245,87,108,0.3);
        }

        .choice-emoji {
            font-size: 35px;
            display: block;
        }

        .choice-name {
            color: white;
            font-size: 14px;
            margin-top: 5px;
        }

        .waiting-status {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 15px;
        }

        button {
            background: none;
            border: none;
        }

        @media (max-width: 550px) {
            .hand-icon { font-size: 50px; }
            .fighter-name { font-size: 18px; }
            .vs { font-size: 30px; }
            .result-text { font-size: 20px; }
            .choice-btn { padding: 10px 20px; min-width: 90px; }
            .choice-emoji { font-size: 28px; }
        }
    </style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <div class="arena">
        <!-- VS Section -->
        <div class="vs-section">
            <div class="fighter" id="player1Fighter">
                <div class="hand-icon" id="player1Hand">🤜</div>
                <div class="fighter-name">YOU</div>
            </div>
            <div class="vs">VS</div>
            <div class="fighter" id="player2Fighter">
                <div class="hand-icon" id="player2Hand">🤛</div>
                <div class="fighter-name">OPPONENT</div>
            </div>
        </div>

        <!-- Result Display -->
        <div class="result-area">
            <div class="result-text" id="resultText">READY TO FIGHT?</div>
            <div class="waiting-status" id="statusText">Click "Find Match" to start</div>
        </div>

        <!-- Action Buttons -->
        <div class="choices-area" id="choicesArea" style="display: none;">
            <div class="choice-btn" data-choice="rock">
                <span class="choice-emoji">🪨</span>
                <span class="choice-name">ROCK</span>
            </div>
            <div class="choice-btn" data-choice="paper">
                <span class="choice-emoji">📄</span>
                <span class="choice-name">PAPER</span>
            </div>
            <div class="choice-btn" data-choice="scissors">
                <span class="choice-emoji">✂️</span>
                <span class="choice-name">SCISSORS</span>
            </div>
        </div>

        <button id="findMatchBtn" style="background: linear-gradient(135deg, #f5576c, #f093fb); color: white; border: none; border-radius: 50px; padding: 14px 35px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px;">🔍 FIND MATCH</button>
    </div>
</div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
    // Game State
    let socket = null;
    let roomId = null;
    let playerNum = null;
    let moveMade = false;
    let waitingOpponent = false;

    // DOM Elements
    const findBtn = document.getElementById('findMatchBtn');
    const choicesArea = document.getElementById('choicesArea');
    const resultTextDiv = document.getElementById('resultText');
    const statusTextDiv = document.getElementById('statusText');
    const player1Hand = document.getElementById('player1Hand');
    const player2Hand = document.getElementById('player2Hand');
    const player1Fighter = document.getElementById('player1Fighter');
    const player2Fighter = document.getElementById('player2Fighter');

    // Helper: Show Damage Number & Shake
    function showDamageAndShake(winner, loserHandElement, loserFighterElement, damage = 3) {
        // Shake loser
        loserFighterElement.classList.add('shake');
        setTimeout(() => loserFighterElement.classList.remove('shake'), 300);

        // Create floating damage number
        const rect = loserHandElement.getBoundingClientRect();
        const gameRect = document.getElementById('gameContainer').getBoundingClientRect();
        
        const damageDiv = document.createElement('div');
        damageDiv.className = 'damage-number';
        damageDiv.textContent = `-${damage}`;
        damageDiv.style.color = winner === 'player1' ? '#4ade80' : '#f87171';
        damageDiv.style.left = `${rect.left + rect.width/2 - gameRect.left - 20}px`;
        damageDiv.style.top = `${rect.top - gameRect.top - 20}px`;
        
        document.getElementById('gameContainer').appendChild(damageDiv);
        setTimeout(() => damageDiv.remove(), 1000);
    }

    // Update Hand Icons based on choice
    function updateHandIcon(player, choice) {
        const handElement = player === 1 ? player1Hand : player2Hand;
        if (!handElement) return;
        
        if (choice === 'rock') handElement.innerHTML = '✊';
        else if (choice === 'paper') handElement.innerHTML = '✋';
        else if (choice === 'scissors') handElement.innerHTML = '✌️';
    }

    // Reset Hands to Fist
    function resetHands() {
        player1Hand.innerHTML = '🤜';
        player2Hand.innerHTML = '🤛';
    }

    // Determine Winner with Animation
    function determineWinnerWithEffect(choice1, choice2, winner) {
        // Update hands
        updateHandIcon(1, choice1);
        updateHandIcon(2, choice2);
        
        let resultText = '';
        let resultClass = '';
        let damage = 3; // Base damage
        
        if (winner === 'tie') {
            resultText = 'DRAW!';
            resultClass = 'tie';
            // Both shake slightly
            player1Fighter.classList.add('shake');
            player2Fighter.classList.add('shake');
            setTimeout(() => {
                player1Fighter.classList.remove('shake');
                player2Fighter.classList.remove('shake');
            }, 300);
        } else {
            const isPlayer1Winner = (winner === 'player1' && playerNum === 1) || (winner === 'player2' && playerNum === 2);
            resultText = isPlayer1Winner ? 'YOU WIN!' : 'YOU LOSE!';
            resultClass = isPlayer1Winner ? 'win' : 'lose';
            
            if (isPlayer1Winner) {
                // Player 1 wins -> Player 2 takes damage
                showDamageAndShake('player1', player2Hand, player2Fighter, damage);
            } else {
                // Player 2 wins -> Player 1 takes damage
                showDamageAndShake('player2', player1Hand, player1Fighter, damage);
            }
        }
        
        resultTextDiv.textContent = resultText;
        resultTextDiv.className = `result-text ${resultClass}`;
        statusTextDiv.textContent = 'Game over! Click "Find Match" to play again.';
        
        // Show choices area again after game over? No, wait for new match.
        choicesArea.style.display = 'none';
        findBtn.style.display = 'block';
    }

    // --- Socket Events ---
    function connectSocket() {
        socket = io('https://dolu.onrender.com', {
            transports: ['websocket', 'polling']
        });

        socket.on('connect', () => {
            console.log('Connected to server');
            statusTextDiv.textContent = 'Connected! Click "Find Match"';
            resultTextDiv.textContent = 'READY TO FIGHT?';
            resultTextDiv.className = 'result-text';
        });

        socket.on('waiting', () => {
            statusTextDiv.textContent = '⏳ Waiting for opponent...';
            resultTextDiv.textContent = 'SEARCHING...';
            waitingOpponent = true;
        });

        socket.on('match_found', (data) => {
            console.log('Match found!', data);
            roomId = data.room_id;
            playerNum = data.player;
            
            statusTextDiv.textContent = `MATCH FOUND! You are Player ${playerNum}`;
            resultTextDiv.textContent = 'FIGHT!';
            resultTextDiv.className = 'result-text';
            
            choicesArea.style.display = 'flex';
            findBtn.style.display = 'none';
            moveMade = false;
            waitingOpponent = false;
            
            // Reset animations
            resetHands();
            player1Fighter.classList.remove('shake');
            player2Fighter.classList.remove('shake');
            
            // Enable choice buttons
            document.querySelectorAll('.choice-btn').forEach(btn => {
                btn.style.pointerEvents = 'auto';
                btn.style.opacity = '1';
            });
        });

        socket.on('game_result', (data) => {
            console.log('Game result:', data);
            determineWinnerWithEffect(data.player1_choice, data.player2_choice, data.winner);
            moveMade = true;
        });

        socket.on('opponent_disconnected', () => {
            statusTextDiv.textContent = 'Opponent left! Click "Find Match" to play again.';
            resultTextDiv.textContent = 'OPPONENT LEFT';
            resultTextDiv.className = 'result-text lose';
            choicesArea.style.display = 'none';
            findBtn.style.display = 'block';
            roomId = null;
        });

        socket.on('disconnect', () => {
            statusTextDiv.textContent = 'Disconnected. Refresh the page.';
            choicesArea.style.display = 'none';
            findBtn.style.display = 'block';
        });
    }

    // --- Event Listeners ---
    findBtn.onclick = () => {
        if (socket === null || !socket.connected) {
            connectSocket();
            setTimeout(() => {
                if (socket && socket.connected) {
                    socket.emit('find_match');
                    statusTextDiv.textContent = '🔍 Finding opponent...';
                }
            }, 500);
        } else {
            socket.emit('find_match');
            statusTextDiv.textContent = '🔍 Finding opponent...';
        }
        resultTextDiv.textContent = 'SEARCHING...';
        resultTextDiv.className = 'result-text';
        resetHands();
    };

    document.querySelectorAll('.choice-btn').forEach(btn => {
        btn.onclick = () => {
            if (moveMade || !roomId) {
                if (!roomId) statusTextDiv.textContent = 'Find an opponent first!';
                return;
            }
            const choice = btn.dataset.choice;
            console.log(`Sending move: ${choice} as player ${playerNum}`);
            
            // Visual feedback: show choice on hand
            updateHandIcon(playerNum, choice);
            
            socket.emit('make_move', {
                room_id: roomId,
                choice: choice,
                player: playerNum
            });
            
            moveMade = true;
            statusTextDiv.textContent = 'Waiting for opponent...';
            
            // Disable choice buttons after move
            document.querySelectorAll('.choice-btn').forEach(b => {
                b.style.pointerEvents = 'none';
                b.style.opacity = '0.5';
            });
        };
    });

    // Initial connection
    connectSocket();
</script>
</body>
</html>
