<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone Paper Scissors - Multiplayer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
        }
        h1 { text-align: center; margin-bottom: 20px; }
        
        /* Profile Section */
        .profile-section {
            background: #f0f0f0;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .avatar {
            font-size: 50px;
            background: #667eea;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .avatar:hover { transform: scale(1.1); }
        .avatar-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .avatar-option {
            font-size: 30px;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: transform 0.2s;
        }
        .avatar-option:hover { transform: scale(1.2); background: #e0e0e0; }
        .username-input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
        }
        .save-profile-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
        }
        .player-name {
            font-weight: bold;
            margin-top: 5px;
        }
        
        /* VS Arena */
        .vs-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .fighter {
            flex: 1;
            text-align: center;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 15px;
        }
        .fighter-hand {
            font-size: 60px;
            transition: transform 0.2s ease;
        }
        .fighter.shake {
            animation: fighterShake 0.3s ease-in-out;
        }
        @keyframes fighterShake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
            100% { transform: translateX(0); }
        }
        .fighter-avatar {
            font-size: 40px;
        }
        .fighter-username {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        .vs-text {
            font-size: 24px;
            font-weight: bold;
            color: #764ba2;
        }
        
        /* Choices */
        .choices {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        .choice {
            font-size: 20px;
            padding: 10px 20px;
            border: none;
            background: #667eea;
            color: white;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .choice:hover { transform: scale(1.1); }
        .choice:disabled { opacity: 0.5; cursor: not-allowed; }
        .choice-hand {
            font-size: 40px;
            display: inline-block;
            transition: transform 0.2s ease;
        }
        .choice:hover .choice-hand {
            animation: handShake 0.5s ease-in-out infinite;
        }
        @keyframes handShake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-15deg); }
            75% { transform: rotate(15deg); }
            100% { transform: rotate(0deg); }
        }
        
        button {
            background: #764ba2;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
        }
        .status {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }
        .result {
            font-size: 20px;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            text-align: center;
        }
        .win { background: #d4edda; color: #155724; }
        .lose { background: #f8d7da; color: #721c24; }
        .tie { background: #fff3cd; color: #856404; }
        .player-info {
            background: #e0e0e0;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            font-weight: bold;
            text-align: center;
        }
        .find-btn { width: 100%; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>🪨 Stone | 📄 Paper | ✂️ Scissors</h1>
    
    <!-- Profile Section -->
    <div class="profile-section" id="profileSection">
        <div class="avatar" id="avatarBtn">😀</div>
        <input type="text" class="username-input" id="usernameInput" placeholder="Enter your name" maxlength="20">
        <button class="save-profile-btn" id="saveProfileBtn">Save Profile</button>
    </div>
    
    <!-- Avatar Selection (hidden by default) -->
    <div id="avatarSelection" style="display:none; margin-bottom: 15px;">
        <div style="font-size: 14px; margin-bottom: 5px;">Choose your avatar:</div>
        <div class="avatar-list">
            <div class="avatar-option" data-avatar="😀">😀</div>
            <div class="avatar-option" data-avatar="😎">😎</div>
            <div class="avatar-option" data-avatar="🤠">🤠</div>
            <div class="avatar-option" data-avatar="👨‍🚀">👨‍🚀</div>
            <div class="avatar-option" data-avatar="🦸">🦸</div>
            <div class="avatar-option" data-avatar="🐱">🐱</div>
            <div class="avatar-option" data-avatar="🐶">🐶</div>
            <div class="avatar-option" data-avatar="🦊">🦊</div>
            <div class="avatar-option" data-avatar="🐼">🐼</div>
            <div class="avatar-option" data-avatar="🤖">🤖</div>
        </div>
    </div>
    
    <!-- VS Arena -->
    <div class="vs-area">
        <div class="fighter" id="fighter1">
            <div class="fighter-avatar" id="fighterAvatar1">😀</div>
            <div class="fighter-hand" id="fighterHand1">🤜</div>
            <div class="fighter-username" id="fighterName1">YOU</div>
        </div>
        <div class="vs-text">VS</div>
        <div class="fighter" id="fighter2">
            <div class="fighter-avatar" id="fighterAvatar2">❓</div>
            <div class="fighter-hand" id="fighterHand2">🤛</div>
            <div class="fighter-username" id="fighterName2">OPPONENT</div>
        </div>
    </div>
    
    <button class="find-btn" id="findBtn">🔍 Find Match</button>
    
    <div class="status" id="status">Set your profile and click "Find Match"</div>
    <div class="player-info" id="playerInfo" style="display:none"></div>
    
    <div class="choices hidden" id="choices">
        <button class="choice" data-choice="rock">
            <span class="choice-hand">✊</span>
            <span>Rock</span>
        </button>
        <button class="choice" data-choice="paper">
            <span class="choice-hand">✋</span>
            <span>Paper</span>
        </button>
        <button class="choice" data-choice="scissors">
            <span class="choice-hand">✌️</span>
            <span>Scissors</span>
        </button>
    </div>
    
    <div id="result" style="display:none"></div>
</div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
    const socket = io();
    let room = null;
    let playerNum = null;
    let moveMade = false;
    
    // Profile data
    let myAvatar = localStorage.getItem('rps_avatar') || '😀';
    let myUsername = localStorage.getItem('rps_username') || '';
    
    // DOM Elements
    const findBtn = document.getElementById('findBtn');
    const statusDiv = document.getElementById('status');
    const playerInfo = document.getElementById('playerInfo');
    const choicesDiv = document.getElementById('choices');
    const resultDiv = document.getElementById('result');
    const fighterHand1 = document.getElementById('fighterHand1');
    const fighterHand2 = document.getElementById('fighterHand2');
    const fighter1 = document.getElementById('fighter1');
    const fighter2 = document.getElementById('fighter2');
    const fighterAvatar1 = document.getElementById('fighterAvatar1');
    const fighterAvatar2 = document.getElementById('fighterAvatar2');
    const fighterName1 = document.getElementById('fighterName1');
    const fighterName2 = document.getElementById('fighterName2');
    const avatarBtn = document.getElementById('avatarBtn');
    const avatarSelection = document.getElementById('avatarSelection');
    const usernameInput = document.getElementById('usernameInput');
    const saveProfileBtn = document.getElementById('saveProfileBtn');
    
    // Load saved profile
    if (myUsername) {
        usernameInput.value = myUsername;
        fighterName1.innerHTML = myUsername;
    }
    avatarBtn.innerHTML = myAvatar;
    fighterAvatar1.innerHTML = myAvatar;
    
    // Avatar selection
    avatarBtn.onclick = () => {
        avatarSelection.style.display = avatarSelection.style.display === 'none' ? 'block' : 'none';
    };
    
    document.querySelectorAll('.avatar-option').forEach(opt => {
        opt.onclick = () => {
            myAvatar = opt.dataset.avatar;
            avatarBtn.innerHTML = myAvatar;
            fighterAvatar1.innerHTML = myAvatar;
            avatarSelection.style.display = 'none';
            localStorage.setItem('rps_avatar', myAvatar);
        };
    });
    
    // Save username
    saveProfileBtn.onclick = () => {
        myUsername = usernameInput.value.trim();
        if (myUsername === '') {
            myUsername = 'Player';
        }
        fighterName1.innerHTML = myUsername;
        localStorage.setItem('rps_username', myUsername);
        statusDiv.innerHTML = 'Profile saved! Click "Find Match" to play.';
    };
    
    function updateHand(handElement, choice) {
        if (choice === 'rock') handElement.innerHTML = '✊';
        else if (choice === 'paper') handElement.innerHTML = '✋';
        else if (choice === 'scissors') handElement.innerHTML = '✌️';
    }
    
    function resetHands() {
        fighterHand1.innerHTML = '🤜';
        fighterHand2.innerHTML = '🤛';
    }
    
    function shakeFighter(fighterElement) {
        fighterElement.classList.add('shake');
        setTimeout(() => fighterElement.classList.remove('shake'), 300);
    }
    
    socket.on('connect', () => {
        console.log('Connected!');
        if (myUsername) {
            statusDiv.innerHTML = '✅ Connected! Click "Find Match"';
        } else {
            statusDiv.innerHTML = '✅ Connected! Set your name and click "Find Match"';
        }
    });
    
    socket.on('waiting', () => {
        console.log('Waiting for opponent...');
        statusDiv.innerHTML = '⏳ Waiting for opponent...';
    });
    
    socket.on('match_found', (data) => {
        console.log('Match found!', data);
        room = data.room;
        playerNum = data.player;
        
        // Send profile info to opponent
        socket.emit('profile', {
            room: room,
            avatar: myAvatar,
            username: myUsername
        });
        
        statusDiv.innerHTML = `🎮 Match found! You are Player ${playerNum}`;
        playerInfo.innerHTML = `You are Player ${playerNum}`;
        playerInfo.style.display = 'block';
        choicesDiv.classList.remove('hidden');
        findBtn.classList.add('hidden');
        moveMade = false;
        resetHands();
        document.querySelectorAll('.choice').forEach(b => b.disabled = false);
    });
    
    // Receive opponent profile
    socket.on('opponent_profile', (data) => {
        console.log('Opponent profile:', data);
        fighterAvatar2.innerHTML = data.avatar;
        fighterName2.innerHTML = data.username || 'Opponent';
    });
    
    socket.on('game_result', (data) => {
        console.log('Game result:', data);
        choicesDiv.classList.add('hidden');
        resultDiv.style.display = 'block';
        
        updateHand(fighterHand1, data.p1_choice);
        updateHand(fighterHand2, data.p2_choice);
        
        const yourChoice = playerNum === 1 ? data.p1_choice : data.p2_choice;
        const opponentChoice = playerNum === 1 ? data.p2_choice : data.p1_choice;
        
        let text = `You chose ${yourChoice}, opponent chose ${opponentChoice}. `;
        let className = '';
        
        if (data.winner === 'tie') {
            text += "It's a tie! 🤝";
            className = 'tie';
            shakeFighter(fighter1);
            shakeFighter(fighter2);
        } else if ((data.winner === 'player1' && playerNum === 1) || (data.winner === 'player2' && playerNum === 2)) {
            text += "🎉 YOU WIN! 🎉";
            className = 'win';
            shakeFighter(fighter2);
        } else {
            text += "😢 You lose!";
            className = 'lose';
            shakeFighter(fighter1);
        }
        
        resultDiv.innerHTML = text;
        resultDiv.className = `result ${className}`;
        statusDiv.innerHTML = 'Game over! Click "Find Match" to play again.';
        findBtn.classList.remove('hidden');
        playerInfo.style.display = 'none';
        room = null;
    });
    
    findBtn.onclick = () => {
        if (!myUsername) {
            statusDiv.innerHTML = '⚠️ Please set your name first!';
            return;
        }
        console.log('Finding match...');
        resultDiv.style.display = 'none';
        statusDiv.innerHTML = '🔍 Finding opponent...';
        socket.emit('find_match');
        resetHands();
        fighterAvatar2.innerHTML = '❓';
        fighterName2.innerHTML = 'OPPONENT';
    };
    
    document.querySelectorAll('.choice').forEach(btn => {
        btn.onclick = () => {
            if (moveMade || !room) return;
            moveMade = true;
            const choice = btn.dataset.choice;
            console.log(`Making move: ${choice} as player ${playerNum}`);
            
            if (playerNum === 1) {
                updateHand(fighterHand1, choice);
            } else {
                updateHand(fighterHand2, choice);
            }
            
            socket.emit('make_move', {
                room: room,
                player: playerNum,
                choice: choice
            });
            statusDiv.innerHTML = '⏳ Waiting for opponent...';
            document.querySelectorAll('.choice').forEach(b => b.disabled = true);
        };
    });
</script>
</body>
</html>
