<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone Paper Scissors</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 { margin: 0 0 20px 0; }
        .choices {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        .choice {
            font-size: 20px;
            padding: 5px 10px;
            border: none;
            background: #667eea;
            color: white;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .choice:hover { transform: scale(1.1); }
        .choice:disabled { opacity: 0.5; cursor: not-allowed; }
        .choice-hand {
            font-size: 40px;
            display: inline-block;
            transition: transform 0.2s ease;
        }
        .choice:hover .choice-hand {
            animation: handShake 0.5s ease-in-out infinite;
        }
        @keyframes handShake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-15deg); }
            75% { transform: rotate(15deg); }
            100% { transform: rotate(0deg); }
        }
        button {
            background: #764ba2;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
        }
        /* Center the find button */
        #findBtn {
            display: block;
            margin: 10px auto;
        }
        .status {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .result {
            font-size: 20px;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
        }
        .win { background: #d4edda; color: #155724; }
        .lose { background: #f8d7da; color: #721c24; }
        .tie { background: #fff3cd; color: #856404; }
        .player-info {
            background: #e0e0e0;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            font-weight: bold;
        }
        .vs-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }
        .fighter {
            flex: 1;
            text-align: center;
        }
        .fighter-hand {
            font-size: 60px;
            transition: transform 0.2s ease;
        }
        .fighter.shake {
            animation: fighterShake 0.3s ease-in-out;
        }
        @keyframes fighterShake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
            100% { transform: translateX(0); }
        }
        .vs-text {
            font-size: 24px;
            font-weight: bold;
            color: #764ba2;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🪨 Stone | 📄 Paper | ✂️ Scissors</h1>
    
    <div class="vs-area">
        <div class="fighter" id="fighter1">
            <div class="fighter-hand" id="fighterHand1">🤜</div>
            <div>YOU</div>
        </div>
        <div class="vs-text">VS</div>
        <div class="fighter" id="fighter2">
            <div class="fighter-hand" id="fighterHand2">🤛</div>
            <div>OPPONENT</div>
        </div>
    </div>
    
    <button id="findBtn">🔍 Find Match</button>
    
    <div class="status" id="status">Click "Find Match" to start</div>
    <div class="player-info" id="playerInfo" style="display:none"></div>
    
    <div class="choices" id="choices" style="display:none">
        <button class="choice" data-choice="rock">
            <span class="choice-hand">✊</span>
            <span>Rock</span>
        </button>
        <button class="choice" data-choice="paper">
            <span class="choice-hand">✋</span>
            <span>Paper</span>
        </button>
        <button class="choice" data-choice="scissors">
            <span class="choice-hand">✌️</span>
            <span>Scissors</span>
        </button>
    </div>
    
    <div id="result" style="display:none"></div>
</div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
    let socket = null;
    let room = null;
    let playerNum = null;
    let moveMade = false;
    let reconnectAttempts = 0;
    
    const findBtn = document.getElementById('findBtn');
    const statusDiv = document.getElementById('status');
    const playerInfo = document.getElementById('playerInfo');
    const choicesDiv = document.getElementById('choices');
    const resultDiv = document.getElementById('result');
    const fighterHand1 = document.getElementById('fighterHand1');
    const fighterHand2 = document.getElementById('fighterHand2');
    const fighter1 = document.getElementById('fighter1');
    const fighter2 = document.getElementById('fighter2');

    function updateHand(handElement, choice) {
        if (choice === 'rock') handElement.innerHTML = '✊';
        else if (choice === 'paper') handElement.innerHTML = '✋';
        else if (choice === 'scissors') handElement.innerHTML = '✌️';
    }

    function resetHands() {
        fighterHand1.innerHTML = '🤜';
        fighterHand2.innerHTML = '🤛';
    }

    function shakeFighter(fighterElement) {
        fighterElement.classList.add('shake');
        setTimeout(() => fighterElement.classList.remove('shake'), 300);
    }

    function connectSocket() {
        if (socket && socket.connected) return;
        
        socket = io({
            transports: ['websocket', 'polling'],
            reconnection: true,
            reconnectionAttempts: Infinity,
            reconnectionDelay: 1000,
            reconnectionDelayMax: 5000,
            timeout: 60000
        });
        
        socket.on('connect', () => {
            console.log('✅ Connected to server');
            reconnectAttempts = 0;
            statusDiv.innerHTML = '✅ Connected! Click "Find Match"';
            resetHands();
            room = null;
            playerNum = null;
            moveMade = false;
            choicesDiv.style.display = 'none';
            findBtn.style.display = 'block';
            playerInfo.style.display = 'none';
            resultDiv.style.display = 'none';
        });
        
        socket.on('disconnect', () => {
            console.log('❌ Disconnected from server');
            statusDiv.innerHTML = '⚠️ Connection lost. Reconnecting...';
            room = null;
            playerNum = null;
            moveMade = false;
            choicesDiv.style.display = 'none';
            findBtn.style.display = 'block';
            playerInfo.style.display = 'none';
        });
        
        socket.on('connect_error', (error) => {
            console.log('Connection error:', error);
            reconnectAttempts++;
            statusDiv.innerHTML = `🔄 Reconnecting... (Attempt ${reconnectAttempts})`;
        });
        
        socket.on('waiting', () => {
            console.log('⏳ Waiting for opponent...');
            statusDiv.innerHTML = '⏳ Waiting for opponent...';
        });
        
        socket.on('match_found', (data) => {
            console.log('🎮 Match found!', data);
            room = data.room;
            playerNum = data.player;
            statusDiv.innerHTML = `🎮 Match found! You are Player ${playerNum}`;
            playerInfo.innerHTML = `You are Player ${playerNum}`;
            playerInfo.style.display = 'block';
            choicesDiv.style.display = 'flex';
            findBtn.style.display = 'none';
            moveMade = false;
            resetHands();
            document.querySelectorAll('.choice').forEach(b => b.disabled = false);
        });
        
        socket.on('game_result', (data) => {
            console.log('🏆 Game result:', data);
            choicesDiv.style.display = 'none';
            resultDiv.style.display = 'block';
            
            updateHand(fighterHand1, data.p1_choice);
            updateHand(fighterHand2, data.p2_choice);
            
            const yourChoice = playerNum === 1 ? data.p1_choice : data.p2_choice;
            const opponentChoice = playerNum === 1 ? data.p2_choice : data.p1_choice;
            
            let text = `You chose ${yourChoice}, opponent chose ${opponentChoice}. `;
            let className = '';
            
            if (data.winner === 'tie') {
                text += "It's a tie! 🤝";
                className = 'tie';
                shakeFighter(fighter1);
                shakeFighter(fighter2);
            } else if ((data.winner === 'player1' && playerNum === 1) || (data.winner === 'player2' && playerNum === 2)) {
                text += "🎉 YOU WIN! 🎉";
                className = 'win';
                shakeFighter(fighter2);
            } else {
                text += "😢 You lose!";
                className = 'lose';
                shakeFighter(fighter1);
            }
            
            resultDiv.innerHTML = text;
            resultDiv.className = `result ${className}`;
            statusDiv.innerHTML = 'Game over! Click "Find Match" to play again.';
            findBtn.style.display = 'block';
            playerInfo.style.display = 'none';
            room = null;
        });
    }

    findBtn.onclick = () => {
        console.log('🔍 Finding match...');
        resultDiv.style.display = 'none';
        statusDiv.innerHTML = '🔍 Finding opponent...';
        
        if (!socket || !socket.connected) {
            statusDiv.innerHTML = '🔄 Connecting to server...';
            connectSocket();
            setTimeout(() => {
                if (socket && socket.connected) {
                    socket.emit('find_match');
                } else {
                    statusDiv.innerHTML = '⚠️ Connection failed. Please refresh the page.';
                }
            }, 1000);
        } else {
            socket.emit('find_match');
        }
        resetHands();
    };

    document.querySelectorAll('.choice').forEach(btn => {
        btn.onclick = () => {
            if (moveMade || !room) return;
            moveMade = true;
            const choice = btn.dataset.choice;
            console.log(`📤 Making move: ${choice} as player ${playerNum}`);
            
            if (playerNum === 1) {
                updateHand(fighterHand1, choice);
            } else {
                updateHand(fighterHand2, choice);
            }
            
            if (socket && socket.connected) {
                socket.emit('make_move', {
                    room: room,
                    player: playerNum,
                    choice: choice
                });
            } else {
                statusDiv.innerHTML = '⚠️ Connection lost. Please find a new match.';
                moveMade = false;
                return;
            }
            statusDiv.innerHTML = '⏳ Waiting for opponent...';
            document.querySelectorAll('.choice').forEach(b => b.disabled = true);
        };
    });

    // Initial connection
    connectSocket();
</script>
</body>
</html>
