<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🪨 Stone | 📄 Paper | ✂️ Scissors - Online Multiplayer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .choices {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .choice-btn {
            font-size: 3.5em;
            padding: 20px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100px;
            height: 100px;
        }

        .choice-btn:hover:not(:disabled) {
            transform: scale(1.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .choice-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 1.1em;
            color: #333;
        }

        .result {
            font-size: 1.3em;
            font-weight: bold;
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
        }

        .result.win {
            background: #d4edda;
            color: #155724;
        }

        .result.lose {
            background: #f8d7da;
            color: #721c24;
        }

        .result.tie {
            background: #fff3cd;
            color: #856404;
        }

        .find-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            margin: 20px 0;
            transition: transform 0.3s;
        }

        .find-btn:hover {
            transform: scale(1.05);
        }

        .player-info {
            background: #e0e0e0;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🪨 Stone | 📄 Paper | ✂️ Scissors</h1>
        
        <div id="gameArea">
            <button class="find-btn" id="findMatch">🔍 Find Match</button>
            <div class="status" id="status">Click "Find Match" to start playing!</div>
            <div class="player-info" id="playerInfo" style="display: none;"></div>
            
            <div class="choices" id="choices" style="display: none;">
                <button class="choice-btn" data-choice="rock">🪨</button>
                <button class="choice-btn" data-choice="paper">📄</button>
                <button class="choice-btn" data-choice="scissors">✂️</button>
            </div>
            
            <div class="result" id="result" style="display: none;"></div>
        </div>
    </div>

    <script>
        let ws = null;
        let roomId = null;
        let playerNum = null;
        let moveMade = false;

        const statusDiv = document.getElementById('status');
        const choicesDiv = document.getElementById('choices');
        const findBtn = document.getElementById('findMatch');
        const resultDiv = document.getElementById('result');
        const playerInfoDiv = document.getElementById('playerInfo');

        // IMPORTANT: Change this URL after deploying to Koyeb
        function getWebSocketUrl() {
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                return 'ws://localhost:8080';
            }
            // CHANGE THIS TO YOUR KOYEB URL AFTER DEPLOYMENT
            // Example: return 'wss://your-app-name.koyeb.app';
            return 'wss://YOUR_KOYEB_APP_NAME.koyeb.app';
        }

        findBtn.onclick = () => {
            // Reset UI
            resultDiv.style.display = 'none';
            moveMade = false;
            
            ws = new WebSocket(getWebSocketUrl());
            
            ws.onopen = () => {
                statusDiv.textContent = '🔍 Finding an opponent...';
                ws.send(JSON.stringify({ action: 'find_match' }));
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.action === 'waiting') {
                    statusDiv.textContent = '⏳ Waiting for another player to join...';
                    statusDiv.style.background = '#fff3cd';
                } 
                else if (data.action === 'match_found') {
                    roomId = data.room_id;
                    playerNum = data.player;
                    statusDiv.textContent = `🎮 Match found! You are Player ${playerNum}. Make your move!`;
                    statusDiv.style.background = '#d4edda';
                    playerInfoDiv.textContent = `You are Player ${playerNum}`;
                    playerInfoDiv.style.display = 'block';
                    choicesDiv.style.display = 'flex';
                    findBtn.style.display = 'none';
                } 
                else if (data.action === 'game_result') {
                    choicesDiv.style.display = 'none';
                    resultDiv.style.display = 'block';
                    
                    const yourChoice = playerNum === 1 ? data.player1_choice : data.player2_choice;
                    const opponentChoice = playerNum === 1 ? data.player2_choice : data.player1_choice;
                    
                    let resultText = `You chose ${yourChoice}, opponent chose ${opponentChoice}. `;
                    let resultClass = '';
                    
                    if (data.winner === 'tie') {
                        resultText += "It's a tie! 🤝";
                        resultClass = 'tie';
                    } else if ((data.winner === 'player1' && playerNum === 1) || (data.winner === 'player2' && playerNum === 2)) {
                        resultText += "🎉 YOU WIN! 🎉";
                        resultClass = 'win';
                    } else {
                        resultText += "😢 You lose! Better luck next time!";
                        resultClass = 'lose';
                    }
                    
                    resultDiv.textContent = resultText;
                    resultDiv.className = `result ${resultClass}`;
                    statusDiv.textContent = 'Game over! Click "Find Match" to play again.';
                    statusDiv.style.background = '#f0f0f0';
                    findBtn.style.display = 'block';
                    playerInfoDiv.style.display = 'none';
                    
                    if (ws) {
                        ws.close();
                    }
                }
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                statusDiv.textContent = 'Connection error. Please try again.';
                statusDiv.style.background = '#f8d7da';
                findBtn.style.display = 'block';
                choicesDiv.style.display = 'none';
            };
            
            ws.onclose = () => {
                if (statusDiv.textContent !== 'Game over! Click "Find Match" to play again.') {
                    statusDiv.textContent = 'Connection lost. Click "Find Match" to try again.';
                    statusDiv.style.background = '#f8d7da';
                    findBtn.style.display = 'block';
                    choicesDiv.style.display = 'none';
                    playerInfoDiv.style.display = 'none';
                }
            };
        };

        // Handle choice buttons
        document.querySelectorAll('.choice-btn').forEach(btn => {
            btn.onclick = () => {
                if (moveMade) return;
                const choice = btn.dataset.choice;
                moveMade = true;
                
                ws.send(JSON.stringify({
                    action: 'make_move',
                    room_id: roomId,
                    choice: choice,
                    player: playerNum
                }));
                
                statusDiv.textContent = 'Waiting for opponent to make their move...';
                
                // Disable all choice buttons after move
                document.querySelectorAll('.choice-btn').forEach(b => {
                    b.disabled = true;
                });
            };
        });
    </script>
</body>
</html>
