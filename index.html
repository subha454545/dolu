<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>⚡ FIGHT! Stone | Paper | Scissors ⚡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0f1e 0%, #0f172a 50%, #1e1b4b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 20px;
        }

        .game-container {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 60px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            width: 100%;
            max-width: 700px;
        }

        .arena {
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 40px;
            padding: 25px;
        }

        .vs-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .fighter {
            flex: 1;
            text-align: center;
            background: rgba(0,0,0,0.5);
            border-radius: 30px;
            padding: 20px;
            transition: all 0.1s ease;
        }

        .fighter.shake {
            animation: shake 0.3s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes shake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-8px, 4px); }
            50% { transform: translate(8px, -4px); }
            75% { transform: translate(-4px, 2px); }
            100% { transform: translate(0, 0); }
        }

        .hand-icon {
            font-size: 80px;
            display: inline-block;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
        }

        .fighter-name {
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
            background: linear-gradient(135deg, #ffd89b, #c7e9fb);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .vs {
            font-size: 45px;
            font-weight: 900;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .damage-number {
            position: absolute;
            font-size: 40px;
            font-weight: 900;
            pointer-events: none;
            z-index: 100;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.5); }
        }

        .result-area {
            background: rgba(0,0,0,0.6);
            border-radius: 50px;
            padding: 15px;
            margin: 20px 0;
            text-align: center;
        }

        .result-text {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .result-text.win { color: #4ade80; text-shadow: 0 0 10px #4ade80; }
        .result-text.lose { color: #f87171; text-shadow: 0 0 10px #f87171; }
        .result-text.tie { color: #fbbf24; text-shadow: 0 0 10px #fbbf24; }

        .choices-area {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .choice-btn {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50px;
            padding: 15px 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            min-width: 120px;
        }

        .choice-btn:hover {
            transform: translateY(-5px);
            border-color: #f5576c;
        }

        .choice-emoji { font-size: 35px; display: block; }
        .choice-name { color: white; font-size: 14px; margin-top: 5px; }

        .waiting-status {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 15px;
        }

        #findMatchBtn {
            background: linear-gradient(135deg, #f5576c, #f093fb);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 14px 35px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }

        @media (max-width: 550px) {
            .hand-icon { font-size: 50px; }
            .fighter-name { font-size: 18px; }
            .vs { font-size: 30px; }
            .result-text { font-size: 20px; }
            .choice-btn { padding: 10px 20px; min-width: 90px; }
            .choice-emoji { font-size: 28px; }
        }
    </style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <div class="arena">
        <div class="vs-section">
            <div class="fighter" id="player1Fighter">
                <div class="hand-icon" id="player1Hand">🤜</div>
                <div class="fighter-name">YOU</div>
            </div>
            <div class="vs">VS</div>
            <div class="fighter" id="player2Fighter">
                <div class="hand-icon" id="player2Hand">🤛</div>
                <div class="fighter-name">OPPONENT</div>
            </div>
        </div>

        <div class="result-area">
            <div class="result-text" id="resultText">READY TO FIGHT?</div>
            <div class="waiting-status" id="statusText">Click "Find Match" to start</div>
        </div>

        <div class="choices-area" id="choicesArea" style="display: none;">
            <div class="choice-btn" data-choice="rock">
                <span class="choice-emoji">🪨</span>
                <span class="choice-name">ROCK</span>
            </div>
            <div class="choice-btn" data-choice="paper">
                <span class="choice-emoji">📄</span>
                <span class="choice-name">PAPER</span>
            </div>
            <div class="choice-btn" data-choice="scissors">
                <span class="choice-emoji">✂️</span>
                <span class="choice-name">SCISSORS</span>
            </div>
        </div>

        <button id="findMatchBtn">🔍 FIND MATCH</button>
    </div>
</div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
    let socket = null;
    let roomId = null;
    let playerNum = null;
    let moveMade = false;

    const findBtn = document.getElementById('findMatchBtn');
    const choicesArea = document.getElementById('choicesArea');
    const resultTextDiv = document.getElementById('resultText');
    const statusTextDiv = document.getElementById('statusText');
    const player1Hand = document.getElementById('player1Hand');
    const player2Hand = document.getElementById('player2Hand');
    const player1Fighter = document.getElementById('player1Fighter');
    const player2Fighter = document.getElementById('player2Fighter');

    function updateHandIcon(player, choice) {
        const hand = player === 1 ? player1Hand : player2Hand;
        if (choice === 'rock') hand.innerHTML = '✊';
        else if (choice === 'paper') hand.innerHTML = '✋';
        else if (choice === 'scissors') hand.innerHTML = '✌️';
    }

    function resetHands() {
        player1Hand.innerHTML = '🤜';
        player2Hand.innerHTML = '🤛';
    }

    function showDamage(winner, loserHand, loserFighter, damage = 3) {
        loserFighter.classList.add('shake');
        setTimeout(() => loserFighter.classList.remove('shake'), 300);

        const rect = loserHand.getBoundingClientRect();
        const container = document.getElementById('gameContainer');
        const containerRect = container.getBoundingClientRect();

        const dmg = document.createElement('div');
        dmg.className = 'damage-number';
        dmg.textContent = `-${damage}`;
        dmg.style.color = winner === 'player1' ? '#4ade80' : '#f87171';
        dmg.style.left = `${rect.left + rect.width/2 - containerRect.left - 20}px`;
        dmg.style.top = `${rect.top - containerRect.top - 20}px`;
        container.appendChild(dmg);
        setTimeout(() => dmg.remove(), 1000);
    }

    function showResult(choice1, choice2, winner) {
        updateHandIcon(1, choice1);
        updateHandIcon(2, choice2);

        if (winner === 'tie') {
            resultTextDiv.textContent = 'DRAW!';
            resultTextDiv.className = 'result-text tie';
            player1Fighter.classList.add('shake');
            player2Fighter.classList.add('shake');
            setTimeout(() => {
                player1Fighter.classList.remove('shake');
                player2Fighter.classList.remove('shake');
            }, 300);
        } else {
            const playerWon = (winner === 'player1' && playerNum === 1) || (winner === 'player2' && playerNum === 2);
            resultTextDiv.textContent = playerWon ? 'YOU WIN!' : 'YOU LOSE!';
            resultTextDiv.className = playerWon ? 'result-text win' : 'result-text lose';

            if (playerWon) {
                showDamage('player1', player2Hand, player2Fighter);
            } else {
                showDamage('player2', player1Hand, player1Fighter);
            }
        }

        statusTextDiv.textContent = 'Game over! Click "Find Match" to play again.';
        choicesArea.style.display = 'none';
        findBtn.style.display = 'block';
        roomId = null;
        moveMade = false;
    }

    function connectSocket() {
        socket = io('https://dolu.onrender.com', { transports: ['websocket', 'polling'] });

        socket.on('connect', () => {
            console.log('Connected');
            statusTextDiv.textContent = 'Connected! Click "Find Match"';
        });

        socket.on('waiting', () => {
            statusTextDiv.textContent = '⏳ Waiting for opponent...';
            resultTextDiv.textContent = 'SEARCHING...';
        });

        socket.on('match_found', (data) => {
            console.log('Match found:', data);
            roomId = data.room_id;
            playerNum = data.player;
            resultTextDiv.textContent = 'FIGHT!';
            resultTextDiv.className = 'result-text';
            statusTextDiv.textContent = `Match found! You are Player ${playerNum}`;
            choicesArea.style.display = 'flex';
            findBtn.style.display = 'none';
            moveMade = false;
            resetHands();
            document.querySelectorAll('.choice-btn').forEach(btn => {
                btn.style.pointerEvents = 'auto';
                btn.style.opacity = '1';
            });
        });

        socket.on('game_result', (data) => {
            console.log('Game result:', data);
            showResult(data.player1_choice, data.player2_choice, data.winner);
        });

        socket.on('opponent_disconnected', () => {
            statusTextDiv.textContent = 'Opponent left! Click "Find Match" to play again.';
            resultTextDiv.textContent = 'OPPONENT LEFT';
            resultTextDiv.className = 'result-text lose';
            choicesArea.style.display = 'none';
            findBtn.style.display = 'block';
            roomId = null;
        });
    }

    findBtn.onclick = () => {
        if (!socket || !socket.connected) {
            connectSocket();
            setTimeout(() => {
                if (socket && socket.connected) {
                    socket.emit('find_match');
                    statusTextDiv.textContent = '🔍 Finding opponent...';
                }
            }, 500);
        } else {
            socket.emit('find_match');
            statusTextDiv.textContent = '🔍 Finding opponent...';
        }
        resultTextDiv.textContent = 'SEARCHING...';
        resetHands();
    };

    document.querySelectorAll('.choice-btn').forEach(btn => {
        btn.onclick = () => {
            if (moveMade || !roomId) {
                if (!roomId) statusTextDiv.textContent = 'Find an opponent first!';
                return;
            }
            const choice = btn.dataset.choice;
            updateHandIcon(playerNum, choice);
            socket.emit('make_move', { room_id: roomId, choice: choice, player: playerNum });
            moveMade = true;
            statusTextDiv.textContent = 'Waiting for opponent...';
            document.querySelectorAll('.choice-btn').forEach(b => {
                b.style.pointerEvents = 'none';
                b.style.opacity = '0.5';
            });
        };
    });

    connectSocket();
</script>
</body>
</html>
