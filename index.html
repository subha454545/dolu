<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone Paper Scissors - Heart System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 550px;
            width: 100%;
            text-align: center;
        }
        h1 { margin: 0 0 20px 0; font-size: 24px; }
        
        .vs-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }
        .fighter {
            flex: 1;
            text-align: center;
            background: #f8f9fa;
            border-radius: 20px;
            padding: 15px;
        }
        .fighter.highlight {
            background: #e8f4f8;
            border: 2px solid #667eea;
            box-shadow: 0 0 10px rgba(102,126,234,0.3);
        }
        .fighter-hand {
            font-size: 60px;
            transition: transform 0.2s ease;
        }
        .fighter.shake {
            animation: fighterShake 0.3s ease-in-out;
        }
        @keyframes fighterShake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
            100% { transform: translateX(0); }
        }
        .fighter-name {
            font-size: 18px;
            font-weight: bold;
            margin-top: 8px;
            color: #333;
        }
        .your-badge {
            font-size: 12px;
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 5px;
        }
        .hearts {
            font-size: 18px;
            margin-top: 8px;
            letter-spacing: 2px;
        }
        .vs-text {
            font-size: 24px;
            font-weight: bold;
            color: #764ba2;
        }
        
        .choices {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        .choice {
            font-size: 20px;
            padding: 10px 20px;
            border: none;
            background: #667eea;
            color: white;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            min-width: 90px;
        }
        .choice:hover { transform: scale(1.05); }
        .choice:disabled { 
            opacity: 0.6; 
            cursor: not-allowed;
            transform: none;
        }
        .choice.selected {
            background: #28a745;
            box-shadow: 0 0 10px rgba(40,167,69,0.5);
        }
        .choice-hand {
            font-size: 40px;
            display: inline-block;
            transition: transform 0.2s ease;
        }
        
        button {
            background: #764ba2;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
        }
        #findBtn {
            display: block;
            margin: 10px auto;
        }
        .status {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .round-result {
            font-size: 18px;
            font-weight: bold;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
        }
        .win { background: #d4edda; color: #155724; }
        .lose { background: #f8d7da; color: #721c24; }
        .tie { background: #fff3cd; color: #856404; }
        .game-over {
            font-size: 24px;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
        }
        .reset-btn {
            background: #ff5722;
            margin-top: 10px;
        }
        .hidden { display: none; }
        .player-indicator {
            font-size: 14px;
            font-weight: bold;
            margin-top: 5px;
            color: #667eea;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🪨 Stone | 📄 Paper | ✂️ Scissors</h1>
    
    <div class="vs-area">
        <div class="fighter" id="fighter1">
            <div class="fighter-hand" id="fighterHand1">🤜</div>
            <div class="fighter-name">PLAYER 1</div>
            <div class="player-indicator" id="player1Indicator"></div>
            <div class="hearts" id="hearts1">❤️ ❤️ ❤️</div>
        </div>
        <div class="vs-text">VS</div>
        <div class="fighter" id="fighter2">
            <div class="fighter-hand" id="fighterHand2">🤛</div>
            <div class="fighter-name">PLAYER 2</div>
            <div class="player-indicator" id="player2Indicator"></div>
            <div class="hearts" id="hearts2">❤️ ❤️ ❤️</div>
        </div>
    </div>
    
    <div class="status" id="playerStatus"></div>
    <button id="findBtn">🔍 Find Match</button>
    <button id="resetBtn" class="reset-btn hidden">🔄 Play Again</button>
    
    <div class="status" id="status">Click "Find Match" to start</div>
    
    <div class="choices hidden" id="choices">
        <button class="choice" data-choice="rock" id="choiceRock">
            <span class="choice-hand">✊</span>
            <span>Rock</span>
        </button>
        <button class="choice" data-choice="paper" id="choicePaper">
            <span class="choice-hand">✋</span>
            <span>Paper</span>
        </button>
        <button class="choice" data-choice="scissors" id="choiceScissors">
            <span class="choice-hand">✌️</span>
            <span>Scissors</span>
        </button>
    </div>
    
    <div id="roundResult" class="round-result hidden"></div>
    <div id="gameOverResult" class="game-over hidden"></div>
</div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
    let socket = null;
    let room = null;
    let playerNum = null;
    let moveMade = false;
    let selectedChoice = null;
    
    // Game state
    let player1Hearts = 3;
    let player2Hearts = 3;
    let gameActive = true;
    let roundInProgress = true;
    
    // RESULT DISPLAY TIME (in milliseconds)
    const RESULT_DISPLAY_TIME = 4000;  // 4 seconds
    
    const findBtn = document.getElementById('findBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusDiv = document.getElementById('status');
    const playerStatusDiv = document.getElementById('playerStatus');
    const choicesDiv = document.getElementById('choices');
    const roundResultDiv = document.getElementById('roundResult');
    const gameOverDiv = document.getElementById('gameOverResult');
    const fighterHand1 = document.getElementById('fighterHand1');
    const fighterHand2 = document.getElementById('fighterHand2');
    const fighter1 = document.getElementById('fighter1');
    const fighter2 = document.getElementById('fighter2');
    const hearts1 = document.getElementById('hearts1');
    const hearts2 = document.getElementById('hearts2');
    const player1Indicator = document.getElementById('player1Indicator');
    const player2Indicator = document.getElementById('player2Indicator');
    const choiceRock = document.getElementById('choiceRock');
    const choicePaper = document.getElementById('choicePaper');
    const choiceScissors = document.getElementById('choiceScissors');
    const allChoices = [choiceRock, choicePaper, choiceScissors];

    function clearSelectedHighlight() {
        allChoices.forEach(choice => {
            choice.classList.remove('selected');
        });
    }

    function highlightSelected(choiceId) {
        clearSelectedHighlight();
        const selectedBtn = document.getElementById(choiceId);
        if (selectedBtn) {
            selectedBtn.classList.add('selected');
        }
    }

    function updateHeartsDisplay() {
        let hearts1Html = '';
        for (let i = 0; i < player1Hearts; i++) hearts1Html += '❤️ ';
        for (let i = player1Hearts; i < 3; i++) hearts1Html += '🖤 ';
        hearts1.innerHTML = hearts1Html.trim();
        
        let hearts2Html = '';
        for (let i = 0; i < player2Hearts; i++) hearts2Html += '❤️ ';
        for (let i = player2Hearts; i < 3; i++) hearts2Html += '🖤 ';
        hearts2.innerHTML = hearts2Html.trim();
    }

    function updatePlayerIndicator() {
        if (playerNum === 1) {
            player1Indicator.innerHTML = '👈 YOU ARE PLAYER 1';
            player2Indicator.innerHTML = '';
            fighter1.classList.add('highlight');
            fighter2.classList.remove('highlight');
            playerStatusDiv.innerHTML = '🎮 You are Player 1 - Make your move!';
        } else if (playerNum === 2) {
            player2Indicator.innerHTML = '👈 YOU ARE PLAYER 2';
            player1Indicator.innerHTML = '';
            fighter2.classList.add('highlight');
            fighter1.classList.remove('highlight');
            playerStatusDiv.innerHTML = '🎮 You are Player 2 - Make your move!';
        }
    }

    function enableChoices() {
        allChoices.forEach(choice => {
            choice.disabled = false;
            choice.style.opacity = '1';
        });
        clearSelectedHighlight();
    }

    function disableChoices() {
        allChoices.forEach(choice => {
            choice.disabled = true;
            choice.style.opacity = '0.6';
        });
    }

    function startNextRound() {
        roundInProgress = true;
        moveMade = false;
        selectedChoice = null;
        resetHands();
        roundResultDiv.classList.add('hidden');
        const roundNumber = 4 - Math.max(player1Hearts, player2Hearts);
        statusDiv.innerHTML = `Round ${roundNumber} - Make your move!`;
        choicesDiv.classList.remove('hidden');
        enableChoices();
    }

    function endGame(winner) {
        gameActive = false;
        roundInProgress = false;
        const isPlayer1Winner = (winner === 'player1' && playerNum === 1) || (winner === 'player2' && playerNum === 2);
        
        gameOverDiv.classList.remove('hidden');
        if (winner === 'tie') {
            gameOverDiv.innerHTML = '🤝 GAME ENDS IN A DRAW! 🤝';
            gameOverDiv.className = 'game-over tie';
        } else if (isPlayer1Winner) {
            gameOverDiv.innerHTML = '🏆🎉 YOU WIN THE GAME! 🎉🏆';
            gameOverDiv.className = 'game-over win';
        } else {
            gameOverDiv.innerHTML = '💀 GAME OVER! YOU LOST! 💀';
            gameOverDiv.className = 'game-over lose';
        }
        statusDiv.innerHTML = 'Game over! Click "Play Again" to start a new match.';
        findBtn.classList.add('hidden');
        resetBtn.classList.remove('hidden');
        choicesDiv.classList.add('hidden');
    }

    function processRoundResult(winner, p1Choice, p2Choice) {
        if (!gameActive) return;
        
        updateHand(fighterHand1, p1Choice);
        updateHand(fighterHand2, p2Choice);
        
        let roundResultText = '';
        
        if (winner === 'tie') {
            roundResultText = "🤝 DRAW! No hearts lost! 🤝";
            roundResultDiv.className = 'round-result tie';
            shakeFighter(fighter1);
            shakeFighter(fighter2);
            roundResultDiv.innerHTML = roundResultText;
            roundResultDiv.classList.remove('hidden');
            
            setTimeout(() => {
                if (gameActive) {
                    startNextRound();
                }
            }, RESULT_DISPLAY_TIME);
            return;
        }
        
        const didWin = (winner === 'player1' && playerNum === 1) || (winner === 'player2' && playerNum === 2);
        
        if (didWin) {
            if (playerNum === 1) {
                player2Hearts--;
                roundResultText = `🎉 YOU WIN! Player 2 loses a heart! 💔 (${player2Hearts}/3 hearts left)`;
            } else {
                player1Hearts--;
                roundResultText = `🎉 YOU WIN! Player 1 loses a heart! 💔 (${player1Hearts}/3 hearts left)`;
            }
            roundResultDiv.className = 'round-result win';
            shakeFighter(fighter2);
        } else {
            if (playerNum === 1) {
                player1Hearts--;
                roundResultText = `💔 YOU LOSE! You lose a heart! 💔 (${player1Hearts}/3 hearts left)`;
            } else {
                player2Hearts--;
                roundResultText = `💔 YOU LOSE! You lose a heart! 💔 (${player2Hearts}/3 hearts left)`;
            }
            roundResultDiv.className = 'round-result lose';
            shakeFighter(fighter1);
        }
        
        updateHeartsDisplay();
        roundResultDiv.innerHTML = roundResultText;
        roundResultDiv.classList.remove('hidden');
        
        if (player1Hearts <= 0) {
            endGame('player2');
            return;
        }
        if (player2Hearts <= 0) {
            endGame('player1');
            return;
        }
        
        roundInProgress = false;
        disableChoices();
        
        setTimeout(() => {
            if (gameActive) {
                startNextRound();
            }
        }, RESULT_DISPLAY_TIME);
    }

    function updateHand(handElement, choice) {
        if (choice === 'rock') handElement.innerHTML = '✊';
        else if (choice === 'paper') handElement.innerHTML = '✋';
        else if (choice === 'scissors') handElement.innerHTML = '✌️';
    }

    function resetHands() {
        fighterHand1.innerHTML = '🤜';
        fighterHand2.innerHTML = '🤛';
    }

    function shakeFighter(fighterElement) {
        fighterElement.classList.add('shake');
        setTimeout(() => fighterElement.classList.remove('shake'), 300);
    }

    function connectSocket() {
        if (socket && socket.connected) return;
        
        socket = io({
            transports: ['websocket', 'polling'],
            reconnection: true,
            reconnectionAttempts: Infinity,
            reconnectionDelay: 1000,
            reconnectionDelayMax: 5000,
            timeout: 60000
        });
        
        socket.on('connect', () => {
            console.log('Connected');
            statusDiv.innerHTML = 'Connected! Click "Find Match"';
        });
        
        socket.on('disconnect', () => {
            statusDiv.innerHTML = 'Connection lost. Reconnecting...';
        });
        
        socket.on('waiting', () => {
            statusDiv.innerHTML = '⏳ Waiting for opponent...';
        });
        
        socket.on('match_found', (data) => {
            room = data.room;
            playerNum = data.player;
            gameActive = true;
            roundInProgress = true;
            moveMade = false;
            selectedChoice = null;
            player1Hearts = 3;
            player2Hearts = 3;
            updateHeartsDisplay();
            updatePlayerIndicator();
            statusDiv.innerHTML = `🎮 Match found!`;
            findBtn.classList.add('hidden');
            resetBtn.classList.add('hidden');
            choicesDiv.classList.remove('hidden');
            resetHands();
            roundResultDiv.classList.add('hidden');
            gameOverDiv.classList.add('hidden');
            enableChoices();
            startNextRound();
        });
        
        socket.on('game_result', (data) => {
            processRoundResult(data.winner, data.p1_choice, data.p2_choice);
        });
    }

    findBtn.onclick = () => {
        if (!socket || !socket.connected) {
            connectSocket();
            setTimeout(() => {
                if (socket && socket.connected) {
                    socket.emit('find_match');
                    statusDiv.innerHTML = '🔍 Finding opponent...';
                }
            }, 500);
        } else {
            socket.emit('find_match');
            statusDiv.innerHTML = '🔍 Finding opponent...';
        }
        resetHands();
        roundResultDiv.classList.add('hidden');
        gameOverDiv.classList.add('hidden');
        clearSelectedHighlight();
    };

    resetBtn.onclick = () => {
        player1Hearts = 3;
        player2Hearts = 3;
        gameActive = true;
        roundInProgress = true;
        moveMade = false;
        selectedChoice = null;
        updateHeartsDisplay();
        resetHands();
        roundResultDiv.classList.add('hidden');
        gameOverDiv.classList.add('hidden');
        statusDiv.innerHTML = 'Starting new game...';
        findBtn.classList.add('hidden');
        resetBtn.classList.add('hidden');
        clearSelectedHighlight();
        
        if (socket && socket.connected) {
            socket.emit('find_match');
        } else {
            connectSocket();
            setTimeout(() => socket.emit('find_match'), 500);
        }
    };

    document.querySelectorAll('.choice').forEach(btn => {
        btn.onclick = () => {
            if (!room || !gameActive || !roundInProgress || moveMade) return;
            
            moveMade = true;
            const choice = btn.dataset.choice;
            selectedChoice = choice;
            
            // Highlight the selected choice
            highlightSelected(btn.id);
            
            // Update hand display immediately
            if (playerNum === 1) {
                updateHand(fighterHand1, choice);
            } else {
                updateHand(fighterHand2, choice);
            }
            
            socket.emit('make_move', {
                room: room,
                player: playerNum,
                choice: choice
            });
            statusDiv.innerHTML = '⏳ Waiting for opponent...';
            disableChoices();
        };
    });

    connectSocket();
    updateHeartsDisplay();
</script>
</body>
</html>
