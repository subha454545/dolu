<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone Paper Scissors - Heart System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 550px;
            width: 100%;
            text-align: center;
        }
        h1 { margin: 0 0 20px 0; font-size: 24px; }
        
        .vs-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }
        .fighter {
            flex: 1;
            text-align: center;
            background: #f8f9fa;
            border-radius: 20px;
            padding: 15px;
        }
        .fighter-hand {
            font-size: 60px;
            transition: transform 0.2s ease;
        }
        .fighter.shake {
            animation: fighterShake 0.3s ease-in-out;
        }
        @keyframes fighterShake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
            100% { transform: translateX(0); }
        }
        .hearts {
            font-size: 24px;
            margin-top: 10px;
            letter-spacing: 3px;
        }
        .heart-full { color: #ff4444; }
        .heart-broken { color: #cccccc; }
        .vs-text {
            font-size: 24px;
            font-weight: bold;
            color: #764ba2;
        }
        
        .choices {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        .choice {
            font-size: 20px;
            padding: 5px 10px;
            border: none;
            background: #667eea;
            color: white;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .choice:hover { transform: scale(1.1); }
        .choice:disabled { opacity: 0.5; cursor: not-allowed; }
        .choice-hand {
            font-size: 40px;
            display: inline-block;
            transition: transform 0.2s ease;
        }
        .choice:hover .choice-hand {
            animation: handShake 0.5s ease-in-out infinite;
        }
        @keyframes handShake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-15deg); }
            75% { transform: rotate(15deg); }
            100% { transform: rotate(0deg); }
        }
        
        button {
            background: #764ba2;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
        }
        #findBtn {
            display: block;
            margin: 10px auto;
        }
        .status {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .result {
            font-size: 20px;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
        }
        .win { background: #d4edda; color: #155724; }
        .lose { background: #f8d7da; color: #721c24; }
        .tie { background: #fff3cd; color: #856404; }
        .player-info {
            background: #e0e0e0;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            font-weight: bold;
        }
        .reset-btn {
            background: #ff5722;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🪨 Stone | 📄 Paper | ✂️ Scissors</h1>
    
    <div class="vs-area">
        <div class="fighter" id="fighter1">
            <div class="fighter-hand" id="fighterHand1">🤜</div>
            <div class="hearts" id="hearts1">❤️ ❤️ ❤️</div>
            <div>YOU</div>
        </div>
        <div class="vs-text">VS</div>
        <div class="fighter" id="fighter2">
            <div class="fighter-hand" id="fighterHand2">🤛</div>
            <div class="hearts" id="hearts2">❤️ ❤️ ❤️</div>
            <div>OPPONENT</div>
        </div>
    </div>
    
    <button id="findBtn">🔍 Find Match</button>
    <button id="resetBtn" class="reset-btn" style="display:none">🔄 Play Again</button>
    
    <div class="status" id="status">Click "Find Match" to start</div>
    <div class="player-info" id="playerInfo" style="display:none"></div>
    
    <div class="choices" id="choices" style="display:none">
        <button class="choice" data-choice="rock">
            <span class="choice-hand">✊</span>
            <span>Rock</span>
        </button>
        <button class="choice" data-choice="paper">
            <span class="choice-hand">✋</span>
            <span>Paper</span>
        </button>
        <button class="choice" data-choice="scissors">
            <span class="choice-hand">✌️</span>
            <span>Scissors</span>
        </button>
    </div>
    
    <div id="result" style="display:none"></div>
</div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
    let socket = null;
    let room = null;
    let playerNum = null;
    let moveMade = false;
    let reconnectAttempts = 0;
    
    // Heart counters (0-3)
    let player1Hearts = 3;
    let player2Hearts = 3;
    let gameActive = true;
    let currentRoundResult = null;
    
    const findBtn = document.getElementById('findBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusDiv = document.getElementById('status');
    const playerInfo = document.getElementById('playerInfo');
    const choicesDiv = document.getElementById('choices');
    const resultDiv = document.getElementById('result');
    const fighterHand1 = document.getElementById('fighterHand1');
    const fighterHand2 = document.getElementById('fighterHand2');
    const fighter1 = document.getElementById('fighter1');
    const fighter2 = document.getElementById('fighter2');
    const hearts1 = document.getElementById('hearts1');
    const hearts2 = document.getElementById('hearts2');

    function updateHeartsDisplay() {
        // Update Player 1 hearts
        let hearts1Html = '';
        for (let i = 0; i < player1Hearts; i++) hearts1Html += '❤️ ';
        for (let i = player1Hearts; i < 3; i++) hearts1Html += '🖤 ';
        hearts1.innerHTML = hearts1Html.trim();
        
        // Update Player 2 hearts
        let hearts2Html = '';
        for (let i = 0; i < player2Hearts; i++) hearts2Html += '❤️ ';
        for (let i = player2Hearts; i < 3; i++) hearts2Html += '🖤 ';
        hearts2.innerHTML = hearts2Html.trim();
    }

    function resetGame() {
        player1Hearts = 3;
        player2Hearts = 3;
        gameActive = true;
        currentRoundResult = null;
        updateHeartsDisplay();
        resetHands();
        resultDiv.style.display = 'none';
        statusDiv.innerHTML = 'Game reset! Click "Find Match" to play again.';
        findBtn.style.display = 'block';
        resetBtn.style.display = 'none';
        choicesDiv.style.display = 'none';
        playerInfo.style.display = 'none';
        room = null;
        playerNum = null;
        moveMade = false;
    }

    function checkGameOver(winner, loserHearts, loserPlayer) {
        if (loserHearts <= 0) {
            gameActive = false;
            const isPlayer1Winner = (winner === 'player1' && playerNum === 1) || (winner === 'player2' && playerNum === 2);
            if (isPlayer1Winner) {
                resultDiv.innerHTML = '🎉🏆 YOU WIN THE GAME! 🏆🎉';
            } else {
                resultDiv.innerHTML = '💀 GAME OVER! YOU LOST! 💀';
            }
            resultDiv.className = 'result win';
            resultDiv.style.display = 'block';
            statusDiv.innerHTML = 'Game over! Click "Play Again" to start a new match.';
            findBtn.style.display = 'none';
            resetBtn.style.display = 'block';
            choicesDiv.style.display = 'none';
            return true;
        }
        return false;
    }

    function processRoundResult(winner, p1Choice, p2Choice) {
        if (!gameActive) return;
        
        updateHand(fighterHand1, p1Choice);
        updateHand(fighterHand2, p2Choice);
        
        let roundResultText = '';
        let roundWinner = '';
        
        if (winner === 'tie') {
            roundResultText = "It's a tie! No hearts lost! 🤝";
            roundWinner = 'tie';
            shakeFighter(fighter1);
            shakeFighter(fighter2);
        } else if (winner === 'player1') {
            roundWinner = 'player1';
            player2Hearts--;
            updateHeartsDisplay();
            roundResultText = `You win this round! Opponent loses a heart! 💔 (${player2Hearts}/3 hearts left)`;
            shakeFighter(fighter2);
            
            if (checkGameOver('player1', player2Hearts, 2)) return;
        } else {
            roundWinner = 'player2';
            player1Hearts--;
            updateHeartsDisplay();
            roundResultText = `You lose this round! You lose a heart! 💔 (${player1Hearts}/3 hearts left)`;
            shakeFighter(fighter1);
            
            if (checkGameOver('player2', player1Hearts, 1)) return;
        }
        
        // Show round result
        resultDiv.innerHTML = roundResultText;
        resultDiv.className = 'result';
        resultDiv.style.display = 'block';
        statusDiv.innerHTML = 'Make your next move!';
        
        // Reset for next round
        moveMade = false;
        document.querySelectorAll('.choice').forEach(b => b.disabled = false);
        resetHands();
    }

    function updateHand(handElement, choice) {
        if (choice === 'rock') handElement.innerHTML = '✊';
        else if (choice === 'paper') handElement.innerHTML = '✋';
        else if (choice === 'scissors') handElement.innerHTML = '✌️';
    }

    function resetHands() {
        fighterHand1.innerHTML = '🤜';
        fighterHand2.innerHTML = '🤛';
    }

    function shakeFighter(fighterElement) {
        fighterElement.classList.add('shake');
        setTimeout(() => fighterElement.classList.remove('shake'), 300);
    }

    function connectSocket() {
        if (socket && socket.connected) return;
        
        socket = io({
            transports: ['websocket', 'polling'],
            reconnection: true,
            reconnectionAttempts: Infinity,
            reconnectionDelay: 1000,
            reconnectionDelayMax: 5000,
            timeout: 60000
        });
        
        socket.on('connect', () => {
            console.log('✅ Connected to server');
            reconnectAttempts = 0;
            statusDiv.innerHTML = '✅ Connected! Click "Find Match"';
            resetHands();
        });
        
        socket.on('disconnect', () => {
            console.log('❌ Disconnected from server');
            statusDiv.innerHTML = '⚠️ Connection lost. Reconnecting...';
        });
        
        socket.on('connect_error', (error) => {
            console.log('Connection error:', error);
            reconnectAttempts++;
            statusDiv.innerHTML = `🔄 Reconnecting... (Attempt ${reconnectAttempts})`;
        });
        
        socket.on('waiting', () => {
            console.log('⏳ Waiting for opponent...');
            statusDiv.innerHTML = '⏳ Waiting for opponent...';
        });
        
        socket.on('match_found', (data) => {
            console.log('🎮 Match found!', data);
            room = data.room;
            playerNum = data.player;
            gameActive = true;
            player1Hearts = 3;
            player2Hearts = 3;
            updateHeartsDisplay();
            statusDiv.innerHTML = `🎮 Match found! You are Player ${playerNum} - Best of 3 hearts!`;
            playerInfo.innerHTML = `You are Player ${playerNum}`;
            playerInfo.style.display = 'block';
            choicesDiv.style.display = 'flex';
            findBtn.style.display = 'none';
            resetBtn.style.display = 'none';
            moveMade = false;
            resetHands();
            resultDiv.style.display = 'none';
            document.querySelectorAll('.choice').forEach(b => b.disabled = false);
        });
        
        socket.on('game_result', (data) => {
            console.log('🏆 Round result:', data);
            processRoundResult(data.winner, data.p1_choice, data.p2_choice);
        });
    }

    findBtn.onclick = () => {
        console.log('🔍 Finding match...');
        resultDiv.style.display = 'none';
        statusDiv.innerHTML = '🔍 Finding opponent...';
        resetGame();
        
        if (!socket || !socket.connected) {
            statusDiv.innerHTML = '🔄 Connecting to server...';
            connectSocket();
            setTimeout(() => {
                if (socket && socket.connected) {
                    socket.emit('find_match');
                } else {
                    statusDiv.innerHTML = '⚠️ Connection failed. Please refresh the page.';
                }
            }, 1000);
        } else {
            socket.emit('find_match');
        }
        resetHands();
    };

    resetBtn.onclick = () => {
        resetGame();
        if (socket && socket.connected) {
            socket.emit('find_match');
        } else {
            connectSocket();
            setTimeout(() => {
                if (socket && socket.connected) {
                    socket.emit('find_match');
                }
            }, 1000);
        }
    };

    document.querySelectorAll('.choice').forEach(btn => {
        btn.onclick = () => {
            if (moveMade || !room || !gameActive) return;
            moveMade = true;
            const choice = btn.dataset.choice;
            console.log(`📤 Making move: ${choice} as player ${playerNum}`);
            
            if (playerNum === 1) {
                updateHand(fighterHand1, choice);
            } else {
                updateHand(fighterHand2, choice);
            }
            
            if (socket && socket.connected) {
                socket.emit('make_move', {
                    room: room,
                    player: playerNum,
                    choice: choice
                });
            } else {
                statusDiv.innerHTML = '⚠️ Connection lost. Please find a new match.';
                moveMade = false;
                return;
            }
            statusDiv.innerHTML = '⏳ Waiting for opponent...';
            document.querySelectorAll('.choice').forEach(b => b.disabled = true);
        };
    });

    // Initial connection
    connectSocket();
    updateHeartsDisplay();
</script>
</body>
</html>
