<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🪨 Stone Paper Scissors</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.95);
            border-radius: 28px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        h1 { font-size: 2em; margin-bottom: 20px; color: #1a1a2e; }
        .choices { display: flex; justify-content: center; gap: 15px; margin: 30px 0; flex-wrap: wrap; }
        .choice-btn {
            font-size: 3.5em;
            padding: 20px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px;
            cursor: pointer;
            width: 100px;
            height: 100px;
            transition: transform 0.2s;
        }
        .choice-btn:hover:not(:disabled) { transform: scale(1.1); }
        .choice-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .status {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            font-weight: 500;
        }
        .find-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 1.1em;
            border-radius: 40px;
            cursor: pointer;
            margin: 20px 0;
            font-weight: bold;
        }
        .result {
            font-size: 1.2em;
            font-weight: bold;
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
        }
        .win { background: #d4edda; color: #155724; }
        .lose { background: #f8d7da; color: #721c24; }
        .tie { background: #fff3cd; color: #856404; }
        .player-info { background: #e0e0e0; padding: 10px; border-radius: 10px; margin: 10px 0; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h1>🪨 Stone | 📄 Paper | ✂️ Scissors</h1>
    <button class="find-btn" id="findMatch">🔍 Find Match</button>
    <div class="status" id="status">Click "Find Match" to start</div>
    <div class="player-info" id="playerInfo" style="display:none"></div>
    <div class="choices" id="choices" style="display:none">
        <button class="choice-btn" data-choice="rock">🪨</button>
        <button class="choice-btn" data-choice="paper">📄</button>
        <button class="choice-btn" data-choice="scissors">✂️</button>
    </div>
    <div class="result" id="result" style="display:none"></div>
</div>

<script>
    const socket = io();
    let roomId = null;
    let playerNum = null;
    let moveMade = false;
    
    const statusDiv = document.getElementById('status');
    const choicesDiv = document.getElementById('choices');
    const findBtn = document.getElementById('findMatch');
    const resultDiv = document.getElementById('result');
    const playerInfoDiv = document.getElementById('playerInfo');

    socket.on('waiting', () => {
        statusDiv.textContent = '⏳ Waiting for opponent...';
    });

    socket.on('match_found', (data) => {
        roomId = data.room_id;
        playerNum = data.player;
        statusDiv.textContent = `🎮 Match found! You are Player ${playerNum}`;
        playerInfoDiv.textContent = `You are Player ${playerNum}`;
        playerInfoDiv.style.display = 'block';
        choicesDiv.style.display = 'flex';
        findBtn.style.display = 'none';
    });

    socket.on('game_result', (data) => {
        choicesDiv.style.display = 'none';
        resultDiv.style.display = 'block';
        
        const yourChoice = playerNum === 1 ? data.player1_choice : data.player2_choice;
        const opponentChoice = playerNum === 1 ? data.player2_choice : data.player1_choice;
        
        let text = `You chose ${yourChoice}, opponent chose ${opponentChoice}. `;
        let cls = '';
        
        if (data.winner === 'tie') {
            text += "It's a tie! 🤝";
            cls = 'tie';
        } else if ((data.winner === 'player1' && playerNum === 1) || (data.winner === 'player2' && playerNum === 2)) {
            text += "🎉 YOU WIN! 🎉";
            cls = 'win';
        } else {
            text += "😢 You lose!";
            cls = 'lose';
        }
        
        resultDiv.textContent = text;
        resultDiv.className = `result ${cls}`;
        statusDiv.textContent = 'Game over! Click "Find Match" to play again.';
        findBtn.style.display = 'block';
        playerInfoDiv.style.display = 'none';
        roomId = null;
    });

    findBtn.onclick = () => {
        resultDiv.style.display = 'none';
        moveMade = false;
        statusDiv.textContent = '🔍 Finding opponent...';
        socket.emit('find_match');
    };

    document.querySelectorAll('.choice-btn').forEach(btn => {
        btn.onclick = () => {
            if (moveMade || !roomId) return;
            moveMade = true;
            socket.emit('make_move', {
                room_id: roomId,
                choice: btn.dataset.choice,
                player: playerNum
            });
            statusDiv.textContent = 'Waiting for opponent...';
            document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
        };
    });
</script>
</body>
</html>
