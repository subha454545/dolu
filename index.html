<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone Paper Scissors - Heart System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 550px;
            width: 100%;
            text-align: center;
        }
        h1 { margin: 0 0 20px 0; font-size: 24px; }
        
        .vs-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }
        .fighter {
            flex: 1;
            text-align: center;
            background: #f8f9fa;
            border-radius: 20px;
            padding: 15px;
        }
        .fighter-hand {
            font-size: 60px;
            transition: transform 0.2s ease;
        }
        .fighter.shake {
            animation: fighterShake 0.3s ease-in-out;
        }
        @keyframes fighterShake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
            100% { transform: translateX(0); }
        }
        .fighter-name {
            font-size: 18px;
            font-weight: bold;
            margin-top: 8px;
            color: #333;
        }
        .hearts {
            font-size: 18px;
            margin-top: 8px;
            letter-spacing: 2px;
        }
        .vs-text {
            font-size: 24px;
            font-weight: bold;
            color: #764ba2;
        }
        
        .choices {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        .choice {
            font-size: 20px;
            padding: 5px 10px;
            border: none;
            background: #667eea;
            color: white;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .choice:hover { transform: scale(1.1); }
        .choice:disabled { opacity: 0.5; cursor: not-allowed; }
        .choice-hand {
            font-size: 40px;
            display: inline-block;
            transition: transform 0.2s ease;
        }
        .choice:hover .choice-hand {
            animation: handShake 0.5s ease-in-out infinite;
        }
        @keyframes handShake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-15deg); }
            75% { transform: rotate(15deg); }
            100% { transform: rotate(0deg); }
        }
        
        button {
            background: #764ba2;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
        }
        #findBtn {
            display: block;
            margin: 10px auto;
        }
        .status {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .round-result {
            font-size: 18px;
            font-weight: bold;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
        }
        .win { background: #d4edda; color: #155724; }
        .lose { background: #f8d7da; color: #721c24; }
        .tie { background: #fff3cd; color: #856404; }
        .game-over {
            font-size: 24px;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
        }
        .reset-btn {
            background: #ff5722;
            margin-top: 10px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>🪨 Stone | 📄 Paper | ✂️ Scissors</h1>
    
    <div class="vs-area">
        <div class="fighter" id="fighter1">
            <div class="fighter-hand" id="fighterHand1">🤜</div>
            <div class="fighter-name">PLAYER 1</div>
            <div class="hearts" id="hearts1">❤️ ❤️ ❤️</div>
        </div>
        <div class="vs-text">VS</div>
        <div class="fighter" id="fighter2">
            <div class="fighter-hand" id="fighterHand2">🤛</div>
            <div class="fighter-name">PLAYER 2</div>
            <div class="hearts" id="hearts2">❤️ ❤️ ❤️</div>
        </div>
    </div>
    
    <button id="findBtn">🔍 Find Match</button>
    <button id="resetBtn" class="reset-btn hidden">🔄 Play Again</button>
    
    <div class="status" id="status">Click "Find Match" to start</div>
    
    <div class="choices hidden" id="choices">
        <button class="choice" data-choice="rock">
            <span class="choice-hand">✊</span>
            <span>Rock</span>
        </button>
        <button class="choice" data-choice="paper">
            <span class="choice-hand">✋</span>
            <span>Paper</span>
        </button>
        <button class="choice" data-choice="scissors">
            <span class="choice-hand">✌️</span>
            <span>Scissors</span>
        </button>
    </div>
    
    <div id="roundResult" class="round-result hidden"></div>
    <div id="gameOverResult" class="game-over hidden"></div>
</div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
    let socket = null;
    let room = null;
    let playerNum = null;
    let moveMade = false;
    let opponentMoveMade = false;
    
    // Game state
    let player1Hearts = 3;
    let player2Hearts = 3;
    let gameActive = true;
    let roundInProgress = false;
    let waitingForRoundReset = false;
    
    const findBtn = document.getElementById('findBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusDiv = document.getElementById('status');
    const choicesDiv = document.getElementById('choices');
    const roundResultDiv = document.getElementById('roundResult');
    const gameOverDiv = document.getElementById('gameOverResult');
    const fighterHand1 = document.getElementById('fighterHand1');
    const fighterHand2 = document.getElementById('fighterHand2');
    const fighter1 = document.getElementById('fighter1');
    const fighter2 = document.getElementById('fighter2');
    const hearts1 = document.getElementById('hearts1');
    const hearts2 = document.getElementById('hearts2');

    function updateHeartsDisplay() {
        let hearts1Html = '';
        for (let i = 0; i < player1Hearts; i++) hearts1Html += '❤️ ';
        for (let i = player1Hearts; i < 3; i++) hearts1Html += '🖤 ';
        hearts1.innerHTML = hearts1Html.trim();
        
        let hearts2Html = '';
        for (let i = 0; i < player2Hearts; i++) hearts2Html += '❤️ ';
        for (let i = player2Hearts; i < 3; i++) hearts2Html += '🖤 ';
        hearts2.innerHTML = hearts2Html.trim();
    }

    function resetGame() {
        player1Hearts = 3;
        player2Hearts = 3;
        gameActive = true;
        roundInProgress = true;
        moveMade = false;
        opponentMoveMade = false;
        waitingForRoundReset = false;
        updateHeartsDisplay();
        resetHands();
        roundResultDiv.classList.add('hidden');
        gameOverDiv.classList.add('hidden');
        statusDiv.innerHTML = 'Make your move!';
        choicesDiv.classList.remove('hidden');
        document.querySelectorAll('.choice').forEach(b => {
            b.disabled = false;
            b.style.opacity = '1';
        });
    }

    function startNextRound() {
        roundInProgress = true;
        moveMade = false;
        opponentMoveMade = false;
        waitingForRoundReset = false;
        resetHands();
        roundResultDiv.classList.add('hidden');
        statusDiv.innerHTML = `Round ${4 - Math.max(player1Hearts, player2Hearts)} - Make your move!`;
        choicesDiv.classList.remove('hidden');
        document.querySelectorAll('.choice').forEach(b => {
            b.disabled = false;
            b.style.opacity = '1';
        });
    }

    function endGame(winner) {
        gameActive = false;
        roundInProgress = false;
        const isPlayer1Winner = (winner === 'player1' && playerNum === 1) || (winner === 'player2' && playerNum === 2);
        
        gameOverDiv.classList.remove('hidden');
        if (winner === 'tie') {
            gameOverDiv.innerHTML = '🤝 GAME ENDS IN A DRAW! 🤝';
            gameOverDiv.className = 'game-over tie';
        } else if (isPlayer1Winner) {
            gameOverDiv.innerHTML = '🏆🎉 YOU WIN THE GAME! 🎉🏆';
            gameOverDiv.className = 'game-over win';
        } else {
            gameOverDiv.innerHTML = '💀 GAME OVER! YOU LOST! 💀';
            gameOverDiv.className = 'game-over lose';
        }
        statusDiv.innerHTML = 'Game over! Click "Play Again" to start a new match.';
        findBtn.classList.add('hidden');
        resetBtn.classList.remove('hidden');
        choicesDiv.classList.add('hidden');
    }

    function processRoundResult(winner, p1Choice, p2Choice) {
        if (!gameActive) return;
        
        updateHand(fighterHand1, p1Choice);
        updateHand(fighterHand2, p2Choice);
        
        let roundResultText = '';
        
        if (winner === 'tie') {
            roundResultText = "🤝 DRAW! No hearts lost! 🤝";
            roundResultDiv.className = 'round-result tie';
            shakeFighter(fighter1);
            shakeFighter(fighter2);
            roundResultDiv.innerHTML = roundResultText;
            roundResultDiv.classList.remove('hidden');
            
            // For tie, reset round immediately
            moveMade = false;
            opponentMoveMade = false;
            statusDiv.innerHTML = 'Tie! Make your next move.';
            choicesDiv.classList.remove('hidden');
            document.querySelectorAll('.choice').forEach(b => {
                b.disabled = false;
                b.style.opacity = '1';
            });
            return;
        }
        
        const didWin = (winner === 'player1' && playerNum === 1) || (winner === 'player2' && playerNum === 2);
        
        if (didWin) {
            if (playerNum === 1) {
                player2Hearts--;
                roundResultText = `🎉 YOU WIN! Player 2 loses a heart! 💔 (${player2Hearts}/3 hearts left)`;
            } else {
                player1Hearts--;
                roundResultText = `🎉 YOU WIN! Player 1 loses a heart! 💔 (${player1Hearts}/3 hearts left)`;
            }
            roundResultDiv.className = 'round-result win';
            shakeFighter(fighter2);
        } else {
            if (playerNum === 1) {
                player1Hearts--;
                roundResultText = `💔 YOU LOSE! You lose a heart! 💔 (${player1Hearts}/3 hearts left)`;
            } else {
                player2Hearts--;
                roundResultText = `💔 YOU LOSE! You lose a heart! 💔 (${player2Hearts}/3 hearts left)`;
            }
            roundResultDiv.className = 'round-result lose';
            shakeFighter(fighter1);
        }
        
        updateHeartsDisplay();
        roundResultDiv.innerHTML = roundResultText;
        roundResultDiv.classList.remove('hidden');
        
        if (player1Hearts <= 0) {
            endGame('player2');
            return;
        }
        if (player2Hearts <= 0) {
            endGame('player1');
            return;
        }
        
        // Result stays visible until BOTH players make their next move
        roundInProgress = false;
        waitingForRoundReset = true;
        statusDiv.innerHTML = 'Result shown. Both players click next move to continue...';
        choicesDiv.classList.add('hidden');
    }

    function updateHand(handElement, choice) {
        if (choice === 'rock') handElement.innerHTML = '✊';
        else if (choice === 'paper') handElement.innerHTML = '✋';
        else if (choice === 'scissors') handElement.innerHTML = '✌️';
    }

    function resetHands() {
        fighterHand1.innerHTML = '🤜';
        fighterHand2.innerHTML = '🤛';
    }

    function shakeFighter(fighterElement) {
        fighterElement.classList.add('shake');
        setTimeout(() => fighterElement.classList.remove('shake'), 300);
    }

    function checkBothReady() {
        if (waitingForRoundReset && moveMade && opponentMoveMade) {
            waitingForRoundReset = false;
            moveMade = false;
            opponentMoveMade = false;
            startNextRound();
        }
    }

    function connectSocket() {
        if (socket && socket.connected) return;
        
        socket = io({
            transports: ['websocket', 'polling'],
            reconnection: true,
            reconnectionAttempts: Infinity,
            reconnectionDelay: 1000,
            reconnectionDelayMax: 5000,
            timeout: 60000
        });
        
        socket.on('connect', () => {
            console.log('Connected');
            statusDiv.innerHTML = 'Connected! Click "Find Match"';
        });
        
        socket.on('disconnect', () => {
            statusDiv.innerHTML = 'Connection lost. Reconnecting...';
        });
        
        socket.on('waiting', () => {
            statusDiv.innerHTML = '⏳ Waiting for opponent...';
        });
        
        socket.on('match_found', (data) => {
            room = data.room;
            playerNum = data.player;
            gameActive = true;
            roundInProgress = true;
            player1Hearts = 3;
            player2Hearts = 3;
            updateHeartsDisplay();
            statusDiv.innerHTML = `🎮 Match found! You are Player ${playerNum}`;
            findBtn.classList.add('hidden');
            resetBtn.classList.add('hidden');
            choicesDiv.classList.remove('hidden');
            moveMade = false;
            opponentMoveMade = false;
            waitingForRoundReset = false;
            resetHands();
            roundResultDiv.classList.add('hidden');
            gameOverDiv.classList.add('hidden');
            startNextRound();
        });
        
        socket.on('opponent_move_made', () => {
            opponentMoveMade = true;
            checkBothReady();
        });
        
        socket.on('game_result', (data) => {
            processRoundResult(data.winner, data.p1_choice, data.p2_choice);
        });
    }

    findBtn.onclick = () => {
        if (!socket || !socket.connected) {
            connectSocket();
            setTimeout(() => {
                if (socket && socket.connected) {
                    socket.emit('find_match');
                    statusDiv.innerHTML = '🔍 Finding opponent...';
                }
            }, 500);
        } else {
            socket.emit('find_match');
            statusDiv.innerHTML = '🔍 Finding opponent...';
        }
        resetHands();
        roundResultDiv.classList.add('hidden');
        gameOverDiv.classList.add('hidden');
    };

    resetBtn.onclick = () => {
        resetGame();
        if (socket && socket.connected) {
            socket.emit('find_match');
        } else {
            connectSocket();
            setTimeout(() => socket.emit('find_match'), 500);
        }
    };

    document.querySelectorAll('.choice').forEach(btn => {
        btn.onclick = () => {
            if (!room || !gameActive) return;
            
            // If waiting for round reset, this counts as next move
            if (waitingForRoundReset) {
                if (!moveMade) {
                    moveMade = true;
                    socket.emit('player_ready', { room: room });
                    statusDiv.innerHTML = 'Waiting for opponent to be ready...';
                    choicesDiv.classList.add('hidden');
                }
                return;
            }
            
            // Normal move during active round
            if (!roundInProgress || moveMade) return;
            
            moveMade = true;
            const choice = btn.dataset.choice;
            
            if (playerNum === 1) {
                updateHand(fighterHand1, choice);
            } else {
                updateHand(fighterHand2, choice);
            }
            
            socket.emit('make_move', {
                room: room,
                player: playerNum,
                choice: choice
            });
            statusDiv.innerHTML = '⏳ Waiting for opponent...';
            choicesDiv.classList.add('hidden');
        };
    });

    connectSocket();
    updateHeartsDisplay();
</script>
</body>
</html>
