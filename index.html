<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone Paper Scissors</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
        }
        h1 { margin: 0 0 20px 0; }
        .choices {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        .choice {
            font-size: 30px;
            padding: 10px 20px;
            border: none;
            background: #667eea;
            color: white;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .choice:hover { transform: scale(1.1); }
        .choice:disabled { opacity: 0.5; cursor: not-allowed; }
        button {
            background: #764ba2;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
        }
        .status {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .result {
            font-size: 20px;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
        }
        .win { background: #d4edda; color: #155724; }
        .lose { background: #f8d7da; color: #721c24; }
        .tie { background: #fff3cd; color: #856404; }
        .player-info {
            background: #e0e0e0;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🪨 Stone | 📄 Paper | ✂️ Scissors</h1>
    
    <button id="findBtn">🔍 Find Match</button>
    
    <div class="status" id="status">Click "Find Match" to start</div>
    <div class="player-info" id="playerInfo" style="display:none"></div>
    
    <div class="choices" id="choices" style="display:none">
        <button class="choice" data-choice="rock">🪨 Rock</button>
        <button class="choice" data-choice="paper">📄 Paper</button>
        <button class="choice" data-choice="scissors">✂️ Scissors</button>
    </div>
    
    <div id="result" style="display:none"></div>
</div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
    const socket = io();
    let room = null;
    let playerNum = null;
    let moveMade = false;
    
    const findBtn = document.getElementById('findBtn');
    const statusDiv = document.getElementById('status');
    const playerInfo = document.getElementById('playerInfo');
    const choicesDiv = document.getElementById('choices');
    const resultDiv = document.getElementById('result');

    socket.on('connect', () => {
        console.log('Connected!');
        statusDiv.innerHTML = '✅ Connected! Click "Find Match"';
    });

    socket.on('waiting', () => {
        console.log('Waiting for opponent...');
        statusDiv.innerHTML = '⏳ Waiting for opponent...';
    });

    socket.on('match_found', (data) => {
        console.log('Match found!', data);
        room = data.room;
        playerNum = data.player;
        statusDiv.innerHTML = `🎮 Match found! You are Player ${playerNum}`;
        playerInfo.innerHTML = `You are Player ${playerNum}`;
        playerInfo.style.display = 'block';
        choicesDiv.style.display = 'flex';
        findBtn.style.display = 'none';
        moveMade = false;
        document.querySelectorAll('.choice').forEach(b => b.disabled = false);
    });

    socket.on('game_result', (data) => {
        console.log('Game result:', data);
        choicesDiv.style.display = 'none';
        resultDiv.style.display = 'block';
        
        const yourChoice = playerNum === 1 ? data.p1_choice : data.p2_choice;
        const opponentChoice = playerNum === 1 ? data.p2_choice : data.p1_choice;
        
        let text = `You chose ${yourChoice}, opponent chose ${opponentChoice}. `;
        let className = '';
        
        if (data.winner === 'tie') {
            text += "It's a tie! 🤝";
            className = 'tie';
        } else if ((data.winner === 'player1' && playerNum === 1) || (data.winner === 'player2' && playerNum === 2)) {
            text += "🎉 YOU WIN! 🎉";
            className = 'win';
        } else {
            text += "😢 You lose!";
            className = 'lose';
        }
        
        resultDiv.innerHTML = text;
        resultDiv.className = `result ${className}`;
        statusDiv.innerHTML = 'Game over! Click "Find Match" to play again.';
        findBtn.style.display = 'block';
        playerInfo.style.display = 'none';
        room = null;
    });

    findBtn.onclick = () => {
        console.log('Finding match...');
        resultDiv.style.display = 'none';
        statusDiv.innerHTML = '🔍 Finding opponent...';
        socket.emit('find_match');
    };

    document.querySelectorAll('.choice').forEach(btn => {
        btn.onclick = () => {
            if (moveMade || !room) return;
            moveMade = true;
            const choice = btn.dataset.choice;
            console.log(`Making move: ${choice} as player ${playerNum}`);
            socket.emit('make_move', {
                room: room,
                player: playerNum,
                choice: choice
            });
            statusDiv.innerHTML = '⏳ Waiting for opponent...';
            document.querySelectorAll('.choice').forEach(b => b.disabled = true);
        };
    });
</script>
</body>
</html>
